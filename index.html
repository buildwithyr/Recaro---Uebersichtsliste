<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#171C22">
<title>RECARO – Übersichtsliste</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#171C22;
  --ink-2:#3D464F;
  --ink-3:#6B757F;
  --paper:#E7E9E4;
  --card:#FCFCFB;
  --rule:#C9CDC6;
  --rule-soft:#DFE2DC;
  --teal:#0C6B7D;
  --teal-bg:#E2EEF1;
  --amber:#9C6A12;
  --amber-bg:#F6EBD6;
  --red:#8E3B22;
  --red-bg:#F5E4DE;
  --focus:#0C6B7D;
  --mono:'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  --cond:'Barlow Condensed',system-ui,-apple-system,'Segoe UI',sans-serif;
  --sans:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--paper);color:var(--ink);font-family:var(--sans);
  font-size:15px;line-height:1.5;
  padding-bottom:env(safe-area-inset-bottom);
  -webkit-font-smoothing:antialiased;
}

/* ---------- Kopf ---------- */
.top{
  position:sticky;top:0;z-index:50;background:var(--ink);
  padding:calc(10px + env(safe-area-inset-top)) 16px 12px;
}
.brand{
  display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:10px;
}
.brand h1{
  font-family:var(--cond);font-weight:700;font-size:19px;letter-spacing:.14em;
  text-transform:uppercase;color:#fff;
}
.brand .sub{
  font-family:var(--cond);font-size:14px;letter-spacing:.1em;text-transform:uppercase;
  color:#8FA3AC;font-weight:500;
}
.searchwrap{position:relative}
#q{
  width:100%;font-family:var(--mono);font-size:17px;font-weight:500;
  padding:13px 42px 13px 14px;border:0;border-radius:3px;
  background:#fff;color:var(--ink);
}
#q::placeholder{color:#9AA4AD;font-weight:400}
#q:focus{outline:3px solid var(--teal);outline-offset:2px}
.clear{
  position:absolute;right:44px;top:50%;transform:translateY(-50%);
  border:0;background:none;font-size:22px;color:#9AA4AD;cursor:pointer;
  width:34px;height:34px;line-height:1;border-radius:3px;
}
.clear:hover{color:var(--ink)}
.scanbtn{
  position:absolute;right:6px;top:50%;transform:translateY(-50%);
  border:0;background:none;color:#6B757F;cursor:pointer;
  width:36px;height:36px;display:flex;align-items:center;justify-content:center;border-radius:3px;
}
.scanbtn:hover:not(:disabled){color:var(--teal);background:var(--teal-bg)}
.scanbtn:disabled{opacity:.35;cursor:default}
.quelle{
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:9px;
  font-family:var(--cond);font-size:13px;letter-spacing:.07em;text-transform:uppercase;color:#8FA3AC;
}
.quelle[hidden]{display:none}
.quelle #qname{font-family:var(--mono);font-size:12px;letter-spacing:0;text-transform:none;color:#B8C6CD}
.reload{
  font-family:var(--cond);font-size:12.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;
  background:var(--teal);color:#fff;border:0;border-radius:2px;padding:5px 11px;cursor:pointer;
}
.reload.alt{background:none;color:#8FA3AC;border:1px solid #39434C}
.reload:hover{filter:brightness(1.12)}
.drop{
  border:2px dashed var(--rule);border-radius:4px;background:var(--card);
  padding:38px 22px;text-align:center;margin-top:22px;
}
.drop.over{border-color:var(--teal);background:var(--teal-bg)}
.drop h3{font-family:var(--cond);font-size:23px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink);margin-bottom:9px}
.drop p{color:var(--ink-3);max-width:48ch;margin:0 auto 16px}
.pick{
  font-family:var(--cond);font-size:15px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;
  background:var(--ink);color:#fff;border:0;border-radius:3px;padding:12px 22px;cursor:pointer;
}
.pick:hover{background:var(--teal)}
.lade{font-family:var(--cond);font-size:15px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);padding:34px 4px}
.hint{
  margin-top:8px;font-family:var(--cond);font-size:13px;letter-spacing:.07em;
  text-transform:uppercase;color:#7E919B;
}
.datacard{margin:14px 0;background:var(--card);border:1px solid var(--rule-soft);border-radius:3px;padding:12px 14px;font-size:13px;color:var(--ink-2)}
.datacard b{font-family:var(--mono);word-break:break-all}.dataactions,.filters,.recent{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-top:9px}
.smallbtn,.filter{border:1px solid var(--rule);background:#fff;color:var(--ink-2);border-radius:3px;padding:6px 10px;cursor:pointer;font:600 13px var(--cond);letter-spacing:.04em}
.smallbtn:hover,.filter:hover,.filter.active{border-color:var(--teal);color:var(--teal);background:var(--teal-bg)}
.agewarn{margin-top:8px;color:var(--amber)}.validation{margin:12px 0;padding:10px 13px;border-left:4px solid var(--amber);background:var(--amber-bg)}
.copy{margin-left:7px;border:0;background:transparent;color:inherit;cursor:pointer;opacity:.65;font-size:13px}.copy:hover{opacity:1;color:var(--teal)}
.toast{position:fixed;z-index:300;bottom:calc(18px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 14px;border-radius:3px}

/* ---------- Kamera-Overlay ---------- */
.scanoverlay{position:fixed;inset:0;z-index:200;background:#0B0E11;display:flex;flex-direction:column}
.scanoverlay[hidden]{display:none}
.scantop{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:calc(12px + env(safe-area-inset-top)) 16px 12px;
  font-family:var(--cond);font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:#B8C6CD;
}
.scanclose{border:0;background:none;color:#fff;font-size:26px;line-height:1;cursor:pointer;width:38px;height:38px}
.scanstage{position:relative;flex:1;min-height:0;background:#000;overflow:hidden}
#scanvideo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.scanframe{
  position:absolute;left:8%;right:8%;top:38%;bottom:38%;
  border:2px solid rgba(95,200,222,.9);border-radius:6px;
  box-shadow:0 0 0 2000px rgba(0,0,0,.42);pointer-events:none;
}
.scanfoot{padding:14px 16px calc(16px + env(safe-area-inset-bottom));font-size:14px;color:#B8C6CD;text-align:center;min-height:20px}
.scanfoot b{color:#fff;font-family:var(--mono);font-weight:500}
.scanfoot .err{background:var(--red-bg);color:#5E2716;border-radius:3px;padding:11px 13px;text-align:left;font-size:14px;line-height:1.45}
.scanfoot .err a{color:#5E2716;font-weight:600}
.scanfoot .err code{font-family:var(--mono);background:rgba(94,39,22,.12);padding:1px 5px;border-radius:2px;font-size:13px}

/* ---------- Trefferliste ---------- */
.wrap{max-width:940px;margin:0 auto;padding:0 16px}
.results{margin:14px 0 40px}
.rescount{
  font-family:var(--cond);font-size:13px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--ink-3);padding:6px 2px 10px;
}
.row{
  display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  background:var(--card);border:1px solid var(--rule-soft);border-left-width:4px;
  border-radius:3px;padding:11px 13px;margin-bottom:6px;cursor:pointer;
  font-family:inherit;font-size:inherit;color:inherit;
}
.row:hover,.row.sel{border-color:var(--teal);background:#fff}
.row.sel{outline:2px solid var(--teal);outline-offset:1px}
.row.t-bt{border-left-color:var(--ink-2)}
.row.t-sch{border-left-color:var(--teal)}
.row.t-ez{border-left-color:var(--amber)}
.row .n{font-family:var(--mono);font-weight:600;font-size:15px;white-space:nowrap}
.row .d{color:var(--ink-3);font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.row .tag{
  font-family:var(--cond);font-size:12px;letter-spacing:.09em;text-transform:uppercase;
  font-weight:600;padding:2px 7px;border-radius:2px;white-space:nowrap;
}
.tag-bt{background:#E3E6E2;color:var(--ink-2)}
.tag-sch{background:var(--teal-bg);color:var(--teal)}
.tag-ez{background:var(--amber-bg);color:var(--amber)}
mark{background:#FCE9A8;color:inherit;border-radius:2px;padding:0 1px}

/* ---------- Detail ---------- */
.back{
  display:inline-flex;align-items:center;gap:7px;background:none;border:0;
  font-family:var(--cond);font-size:14px;letter-spacing:.1em;text-transform:uppercase;
  font-weight:600;color:var(--ink-2);cursor:pointer;padding:14px 2px 8px;
}
.back:hover{color:var(--teal)}

/* Signatur: Nummernzerleger */
.numband{
  background:var(--ink);color:#fff;border-radius:3px;padding:20px 18px 14px;
  margin-bottom:14px;overflow-x:auto;
}
.numband .kind{
  font-family:var(--cond);font-size:13px;letter-spacing:.16em;text-transform:uppercase;
  color:#8FA3AC;font-weight:600;margin-bottom:12px;
}
.segs{display:flex;align-items:flex-end;gap:0;min-width:max-content}
.seg{padding:0 10px;border-left:1px solid #39434C;position:relative}
.seg:first-child{border-left:0;padding-left:0}
.seg .v{
  font-family:var(--mono);font-weight:600;font-size:30px;line-height:1;
  letter-spacing:.01em;display:block;
}
.seg .l{
  font-family:var(--cond);font-size:11px;letter-spacing:.13em;text-transform:uppercase;
  color:#7E919B;margin-top:8px;display:block;white-space:nowrap;
}
.seg.hl .v{color:#5FC8DE}
.seg.hl .l{color:#5FC8DE}
.derive{
  margin-top:14px;padding-top:12px;border-top:1px solid #2B343C;
  font-family:var(--cond);font-size:14px;letter-spacing:.06em;text-transform:uppercase;
  color:#8FA3AC;display:flex;align-items:center;gap:9px;flex-wrap:wrap;
}
.derive b{font-family:var(--mono);font-size:14px;color:#5FC8DE;font-weight:600;letter-spacing:0}

/* Feldtabelle */
.block{background:var(--card);border:1px solid var(--rule-soft);border-radius:3px;margin-bottom:12px}
.block h2{
  font-family:var(--cond);font-size:13px;letter-spacing:.14em;text-transform:uppercase;
  font-weight:600;color:var(--ink-3);padding:11px 14px 9px;border-bottom:1px solid var(--rule-soft);
}
.fields{display:grid;grid-template-columns:190px 1fr}
.fields>div{padding:9px 14px;border-bottom:1px solid var(--rule-soft);min-width:0}
.fields>div:nth-last-child(-n+2){border-bottom:0}
.fields .k{
  font-family:var(--cond);font-size:13.5px;letter-spacing:.06em;text-transform:uppercase;
  color:var(--ink-3);font-weight:600;background:#F4F5F2;
}
.fields .v{word-break:break-word;font-size:14.5px}
.fields .v.num{font-family:var(--mono);font-size:14px}
.multi{display:block;padding:1px 0}

/* Chips */
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:12px 14px}
.chip{
  font-family:var(--mono);font-size:13.5px;font-weight:500;
  border:1px solid var(--rule);background:#fff;color:var(--ink);
  padding:6px 10px;border-radius:3px;cursor:pointer;
}
.chip:hover{border-color:var(--teal);color:var(--teal);background:var(--teal-bg)}
.chip.ez{border-style:dashed}
.chip .cd{font-family:var(--sans);font-size:12px;color:var(--ink-3);margin-left:6px}
.chip:hover .cd{color:var(--teal)}

/* Notiz */
.note{
  display:flex;gap:9px;padding:10px 13px;border-radius:3px;margin-bottom:12px;
  font-size:14px;line-height:1.45;
}
.note .nl{
  font-family:var(--cond);font-size:12px;letter-spacing:.1em;text-transform:uppercase;
  font-weight:700;white-space:nowrap;padding-top:1px;
}
.note-amber{background:var(--amber-bg);color:#5C400B}
.note-amber .nl{color:var(--amber)}
.note-red{background:var(--red-bg);color:#5E2716}
.note-red .nl{color:var(--red)}

/* Herkunft */
.prov{
  font-family:var(--cond);font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--ink-3);padding:10px 14px;display:flex;flex-wrap:wrap;gap:6px 18px;
}
.prov span b{font-family:var(--mono);letter-spacing:0;font-weight:500;color:var(--ink-2);text-transform:none}

/* Leerzustand */
.empty{padding:34px 4px;color:var(--ink-3)}
.empty h3{font-family:var(--cond);font-size:22px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);margin-bottom:10px}
.empty p{margin-bottom:7px;max-width:52ch}
.empty code{font-family:var(--mono);font-size:13.5px;background:#DDE0DB;padding:2px 5px;border-radius:2px}
.stats{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}
.stat{background:var(--card);border:1px solid var(--rule-soft);border-radius:3px;padding:10px 13px}
.stat b{font-family:var(--mono);font-size:19px;font-weight:600;display:block;line-height:1.2}
.stat span{font-family:var(--cond);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}

footer{
  border-top:1px solid var(--rule);margin-top:30px;padding:16px 0 30px;
  font-family:var(--cond);font-size:12.5px;letter-spacing:.07em;text-transform:uppercase;
  color:var(--ink-3);
}

/* Vergleich */
.comparebar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0 14px;padding:10px 12px;background:var(--teal-bg);border:1px solid #BCD5DB;border-radius:3px}
.comparepick{border:1px solid var(--rule);background:#fff;color:var(--ink-2);padding:5px 9px;border-radius:3px;cursor:pointer;font:600 12px var(--cond);letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.comparepick.chosen{border-color:var(--teal);color:var(--teal);background:var(--teal-bg)}
.row .comparepick{margin-left:auto}.comparehead{display:grid;grid-template-columns:minmax(130px,.7fr) 1fr 1fr;gap:1px;background:var(--rule-soft);border:1px solid var(--rule-soft);margin-bottom:1px}
.comparehead>div,.comparecell{background:var(--card);padding:11px 13px;min-width:0}.comparehead .side{font-family:var(--mono);font-weight:600}.comparegrid{display:grid;grid-template-columns:minmax(130px,.7fr) 1fr 1fr;gap:1px;background:var(--rule-soft);border:1px solid var(--rule-soft)}
.comparelabel{background:#F4F5F2;padding:10px 12px;font:600 13px var(--cond);letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3)}
.comparecell{word-break:break-word}.comparegrid .different{background:#FFF4D9}.missing{color:var(--ink-3);font-style:italic}.setitem{display:inline-block;margin:2px;padding:2px 6px;border-radius:2px;background:#E3E6E2;font:12px var(--mono)}.setitem.only{background:var(--amber-bg);color:#6B480C}
.comparetools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:12px 0}.comparetools label{display:flex;align-items:center;gap:6px}.compare-mobile-side{display:none;font:600 11px var(--cond);text-transform:uppercase;color:var(--ink-3);margin-bottom:3px}
@media print{.top,.back,.comparetools,.comparepick,footer{display:none!important}.wrap{max-width:none}.comparegrid,.comparehead{break-inside:avoid}.comparecell.different{background:#eee!important}}
@media (max-width:620px){
  .fields{grid-template-columns:1fr}
  .fields .k{background:#F4F5F2;border-bottom:0;padding-bottom:2px}
  .fields .v{padding-top:3px}
  .seg .v{font-size:24px}
  .row{flex-wrap:wrap;gap:6px 10px}
  .row .d{flex-basis:100%;white-space:normal}
  .comparehead{grid-template-columns:1fr 1fr}.comparehead>div:first-child{display:none}
  .comparegrid{display:block;background:transparent;border:0}.comparelabel{margin-top:8px;border:1px solid var(--rule-soft)}
  .comparecell{border:1px solid var(--rule-soft);border-top:0;min-height:48px}.compare-mobile-side{display:block}
  .comparepick{min-height:38px}.row .comparepick{margin-left:0}
}
@media (prefers-reduced-motion:no-preference){
  .row,.chip{transition:border-color .12s,background .12s,color .12s}
}
</style>
<link rel="apple-touch-icon" href="icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Schablonen">
</head>
<body>

<header class="top">
  <div class="wrap">
    <div class="brand">
      <h1>RECARO – Übersichtsliste</h1>
      <span class="sub">F-LIST · LIVE</span>
    </div>
    <div class="searchwrap">
      <input id="q" type="search" autocomplete="off" autocapitalize="off" spellcheck="false"
             placeholder="Bauteil- oder Schablonennummer eingeben" disabled>
      <button class="clear" id="clr" aria-label="Suche leeren" hidden>&times;</button>
      <button class="scanbtn" id="scanbtn" aria-label="Barcode scannen" disabled>
        <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="M4 7V5a1 1 0 0 1 1-1h2M20 7V5a1 1 0 0 1-1-1h-2M4 17v2a1 1 0 0 0 1 1h2M20 17v2a1 1 0 0 1-1 1h-2"/>
          <path d="M7 9v6M10 9v6M13 9v6M16 9v6" stroke-width="1.8"/>
        </svg>
      </button>
    </div>
    <div class="hint" id="hint">Trennzeichen egal &mdash; 16431161001 findet 164-31161-001</div>
    <div class="quelle" id="quelle" hidden>
      <span id="qname">&mdash;</span>
      <button class="reload" id="reload">Aktualisieren</button>
      <button class="reload alt" id="wechseln">Andere Datei</button>
    </div>
    <div id="datainfo"></div>
  </div>
</header>

<main class="wrap" id="main"></main>

<div class="scanoverlay" id="scanoverlay" hidden>
  <div class="scantop">
    <span id="scanstate">Kamera wird gestartet &hellip;</span>
    <button class="scanclose" id="scanclose" aria-label="Scannen beenden">&times;</button>
  </div>
  <div class="scanstage">
    <video id="scanvideo" playsinline webkit-playsinline muted></video>
    <div class="scanframe"></div>
  </div>
  <div class="scanfoot" id="scanfoot"></div>
</div>

<footer class="wrap" id="foot"></footer>

<script>
/* ==========================================================
   Excel -> Datenmodell
   Portiert aus extract_data.py, Ergebnis muss identisch sein.
   ========================================================== */

function clean(v){
  if(v === null || v === undefined) return '';
  return String(v).replace(/\u00a0/g,' ').trim();
}

const BAUTEIL_RE = /^164[-X*]\d{5}[-SG_]/;

function colName(n){           // 0-basiert -> A, B, ... AA
  let s='';
  for(n = n+1; n > 0; ){
/* ==========================================================
   Arbeitsmappen-Validierung
   Erst nach den vollständig definierten Raster-/Spaltenhilfen.
   ========================================================== */
const EXCEL_MAX_AGE_DAYS = 14;

function pruefeStruktur(wb){
  const errors=[], warnings=[];
  const required=['Übersichtsliste','Schablnr - Bauteilnr.','Schablonen'];
  required.forEach(n => { if(!wb.SheetNames.includes(n)) errors.push('Benötigtes Blatt „'+n+'“ fehlt.'); });
  if(errors.length) return {errors,warnings};
  const U=raster(wb.Sheets['Übersichtsliste'],18), M=raster(wb.Sheets['Schablnr - Bauteilnr.']), S=raster(wb.Sheets['Schablonen'],19);
  if(U.cols < 18) errors.push('Blatt „Übersichtsliste“: mindestens 18 Spalten (A–R) erwartet, gefunden: '+U.cols+'.');
  if(U.rows < 2) errors.push('Blatt „Übersichtsliste“: keine Datenzeilen ab Zeile 2 gefunden.');
  if(!U.g.slice(1).some(r => BAUTEIL_RE.test(r[0]||''))) errors.push('Blatt „Übersichtsliste“, Spalte A: keine gültige Bauteilnummer gefunden.');
  if(M.rows < 4) errors.push('Blatt „Schablnr - Bauteilnr.“: Daten ab Zeile 4 fehlen.');
  if(!(M.g[2]||[]).some(v => /^T/i.test(v||''))) errors.push('Blatt „Schablnr - Bauteilnr.“, Zeile 3: keine gültige Schablonenspalte gefunden.');
  if(!S.g.slice(1).some(r => clean(r[0]))) errors.push('Blatt „Schablonen“, Spalte A: keine verwendbaren Registereinträge gefunden.');
  if(U.g[0] && !U.g[0].some(Boolean)) warnings.push('Blatt „Übersichtsliste“, Zeile 1: keine erkennbaren Überschriften. Die Datenpositionen werden strukturell geprüft.');
  if(S.cols < 7) warnings.push('Blatt „Schablonen“: weniger als 7 Spalten; Materialangaben können fehlen.');
  return {errors,warnings};
}

  const check=pruefeStruktur(wb);
  if(check.errors.length) throw new Error(check.errors.join(' '));

/* Blatt in ein 2D-Raster lesen, verbundene Zellen auflösen */
function raster(ws, maxCols){
  if(!ws || !ws['!ref']) return {g:[], rows:0, cols:0};
  const rng = XLSX.utils.decode_range(ws['!ref']);
  const rows = rng.e.r + 1;
  const cols = Math.min(rng.e.c + 1, maxCols || 99999);
  const g = [];
  for(let r=0; r<rows; r++){
    const line = new Array(cols).fill('');
    for(let c=0; c<cols; c++){
      const cell = ws[XLSX.utils.encode_cell({r:r, c:c})];
      if(cell && cell.v !== undefined) line[c] = clean(cell.v);
    }
    g.push(line);
  }
  (ws['!merges']||[]).forEach(m => {
    if(m.s.r >= rows || m.s.c >= cols) return;
    const v = g[m.s.r][m.s.c];
    for(let r=m.s.r; r<=Math.min(m.e.r, rows-1); r++)
      for(let c=m.s.c; c<=Math.min(m.e.c, cols-1); c++) g[r][c] = v;
  });
  return {g:g, rows:rows, cols:cols};
}

function basis(t){
  if(t.indexOf('_GS') >= 0) return t;
  const m = /^(T164-\d{4})/.exec(t);
  return m ? m[1] : t;
}

/* Spaltenindex (0-basiert) -> Feldname, wie in der Übersichtsliste */
const FELDER = [
  [1,'ss'],[2,'einheit'],[3,'extern'],[4,'bez'],[5,'topassy'],[6,'g'],
  [7,'ht'],[8,'wabenkern'],[9,'potting'],[10,'bemerkung'],[11,'fai'],
  [12,'projekt'],[13,'spalteN'],[14,'mastermodell'],[15,'spalteP'],
  [16,'prog'],[17,'spalteR']
];

function baueDaten(wb){
  const fehlt = [];
  ['Übersichtsliste','Schablnr - Bauteilnr.','Schablonen'].forEach(n => {
    if(wb.SheetNames.indexOf(n) < 0) fehlt.push(n);
  });
  if(fehlt.length) throw new Error('In der Datei fehlen diese Blätter: ' + fehlt.join(', '));

  const U = raster(wb.Sheets['Übersichtsliste'], 18);
  const M = raster(wb.Sheets['Schablnr - Bauteilnr.']);   // ohne Obergrenze: neue Schablonenspalten sollen mitkommen
  const S = raster(wb.Sheets['Schablonen'], 19);

  /* ---- Bauteile ---- */
  const bt = new Map();
  for(let r=1; r<U.rows; r++){
    const nr = U.g[r][0];
    if(!BAUTEIL_RE.test(nr)) continue;
    let d = bt.get(nr);
    if(!d){ d = {nr:nr, z:[]}; bt.set(nr, d); }
    d.z.push(r+1);                                  // 1-basierte Excel-Zeile
    FELDER.forEach(f => {
      const v = U.g[r][f[0]];
      if(!v) return;
      if(d[f[1]] === undefined) d[f[1]] = v;
      else if(d[f[1]].split(' | ').indexOf(v) < 0) d[f[1]] += ' | ' + v;
    });
  }

  /* ---- Matrix: Schablone -> Bauteile ---- */
  const schVonBt = new Map(), btVonSch = new Map(), mspalte = new Map();
  let paare = 0;
  for(let c=0; c<M.cols; c++){
    const t = M.g[2] ? M.g[2][c] : '';               // Zeile 3
    if(!t || t.charAt(0).toUpperCase() !== 'T') continue;
    mspalte.set(t, colName(c));
    for(let r=3; r<M.rows; r++){                     // ab Zeile 4
      const b = M.g[r][c];
      if(!b) continue;
      if(!schVonBt.has(b)) schVonBt.set(b, []);
      if(schVonBt.get(b).indexOf(t) < 0){ schVonBt.get(b).push(t); paare++; }
      if(!btVonSch.has(t)) btVonSch.set(t, []);
      if(btVonSch.get(t).indexOf(b) < 0) btVonSch.get(t).push(b);
    }
  }
  schVonBt.forEach(v => v.sort());
  btVonSch.forEach(v => v.sort());

  /* ---- Schablonenregister ---- */
  const reg = new Map();
  for(let r=1; r<S.rows; r++){
    const nr = S.g[r][0];
    if(!nr) continue;
    reg.set(nr, {nr:nr, bez:S.g[r][1], pdf:S.g[r][2], beschr:S.g[r][3],
                 material:S.g[r][6], zeile:r+1});
  }
  const regNachBasis = new Map();
  reg.forEach((v,nr) => {
    if(nr.indexOf('SC0') === 0) return;
    const b = basis(nr);
    if(!regNachBasis.has(b)) regNachBasis.set(b, []);
    regNachBasis.get(b).push(nr);
  });

  /* ---- Anzeigename je Basisnummer: Matrix-Schreibweise gewinnt ---- */
  const anzeige = new Map();
  const alleNamen = [].concat(Array.from(btVonSch.keys()), Array.from(reg.keys()));
  alleNamen.forEach(nr => {
    if(nr.indexOf('SC0') === 0){ anzeige.set(nr, nr); return; }
    const b = basis(nr);
           nurMatrix:nurMatrix.length, register:reg.size, warnings:check.warnings}
    txt: norm([b.bez,b.projekt,b.extern,b.ht,b.topassy,b.bemerkung,b.mastermodell,b.prog,b.wabenkern,b.potting,b.fai].join(' ')),
  });

  /* ---- Bauteile ausgeben ---- */
  const bauteile = [];
  Array.from(bt.keys()).sort().forEach(nr => {
    const d = bt.get(nr);
    const e = {nr:nr};
    FELDER.forEach(f => { if(d[f[1]]) e[f[1]] = d[f[1]]; });
    e.sch = schVonBt.get(nr) || [];
    e.z = d.z.slice(0,6);
    bauteile.push(e);
  });
  const nurMatrix = Array.from(schVonBt.keys()).filter(b => !bt.has(b)).sort();
  nurMatrix.forEach(nr => bauteile.push({nr:nr, sch:schVonBt.get(nr)||[], nurMatrix:1}));

  /* ---- Schablonen ausgeben ---- */
  const schablonen = [];
  Array.from(new Set(Array.from(anzeige.values()))).sort().forEach(nr => {
    const e = {nr:nr};
    let r = reg.get(nr);
    if(!r && nr.indexOf('SC0') !== 0){
      const kand = regNachBasis.get(basis(nr));
      if(kand && kand.length){ r = reg.get(kand[0]); e.regAls = kand[0]; }
    }
    if(r){
      ['bez','beschr','material','pdf'].forEach(k => { if(r[k]) e[k] = r[k]; });
      e.zeile = r.zeile;
    } else e.ohneReg = 1;

    if(nr.indexOf('SC0') === 0){
      e.ebene = 'Einzelteil';

function backHTML(){
  return '<button class="back" id="bk">&larr; '

function gehe(nr){
  if(current) stack.push(current);
  current = nr;
  render();
}

function zurueck(){
  const prev = stack.pop();
  current = prev || null;
  render();
  if(!current) qEl.focus();
}

function render(){
  if(current && BT.has(current))  return zeigeBauteil(current);
  if(current && SCH.has(current)) return zeigeSchablone(current);
  current = null;
  liste();
}

/* Revisionskennungen wie "_NC_ST", "_A_ST", "_B_BA" sind eine reine Bezeichnungs-
   konvention fuer den Bearbeitungsstand (Revision + Standard/BA/CP), keine Excel-
   Daten - fuer die Suche unwichtig, deshalb automatisch abschneiden. Nur Unterstrich
   als Trennzeichen, weil echte Schablonen-Suffixe in der Excel Bindestrich nutzen
   (z.B. "-CNC", "-VP") und so nie versehentlich getroffen werden koennen. */
function ohneRevision(s){
  return String(s).replace(/_(NC|[A-Z])_(ST|BA|CP)\s*$/i, '').trim();
}

function liste(){
  const roh = qEl.value.trim();
  if(!roh){ startseite(); return; }
  const qr = ohneRevision(roh);

    main.innerHTML = '<div class="empty"><h3>Nichts gefunden</h3>'
      + '<p>Kein Bauteil und keine Schablone passt zu <code>'+esc(roh)+'</code>.</p>'
      + '<p>Es lässt sich auch nach Bezeichnung, Projekt oder Material suchen &mdash; zum Beispiel <code>Seatshell</code> oder <code>Kompaktplatte</code>.</p></div>';
    return;
  }
  let h = '<div class="rescount">'+treffer.length+' Treffer'+(treffer.length===60?' (gekürzt)':'')+'</div><div class="results">';
  treffer.forEach((t,i) => {
    const tag = t.typ==='bt'?'Bauteil':(t.typ==='ez'?'Einzelteil':'Schablone');
    h += '<button class="row t-'+t.typ+'" data-go="'+esc(t.nr)+'" data-i="'+i+'">'
      +  '<span class="n">'+hl(t.nr,qr)+'</span>'
      +  '<span class="tag tag-'+t.typ+'">'+tag+'</span>'
      +  '<span class="d">'+esc(t.roh)+'</span></button>';
  });
  main.innerHTML = h + '</div>';
  bind();
}

qEl.addEventListener('keydown', e => {
  if(!treffer.length) return;
  if(e.key==='ArrowDown' || e.key==='ArrowUp'){
    e.preventDefault();
    sel += (e.key==='ArrowDown'?1:-1);
    if(sel < 0) sel = treffer.length-1;
    if(sel >= treffer.length) sel = 0;
    main.querySelectorAll('.row').forEach((r,i) => r.classList.toggle('sel', i===sel));
    const cur = main.querySelector('.row.sel');
    if(cur) cur.scrollIntoView({block:'nearest'});
  }
  if(e.key==='Enter'){
    e.preventDefault();
    gehe(treffer[sel >= 0 ? sel : 0].nr);
  }
  if(e.key==='Escape'){ qEl.value=''; clrEl.hidden=true; liste(); }
});

  qEl.value=''; clrEl.hidden=true; current=null; stack=[]; qEl.focus(); liste();

    try{
      const p = await dateiHandle.queryPermission({mode:'read'});

function leseDatei(file){
  dateiName = file.name;
  main.innerHTML = '<div class="lade">Datei wird gelesen …</div>';
  const fr = new FileReader();
  fr.onerror = () => dropzone('Die Datei konnte nicht gelesen werden.');
  fr.onload = () => {
    try{
      const wb = XLSX.read(new Uint8Array(fr.result), {type:'array'});
      DATA = baueDaten(wb);
      indexAufbauen();
      quelleEl.hidden = false;
      qnameEl.textContent = dateiName + ' · ' + new Date().toLocaleTimeString('de-AT',{hour:'2-digit',minute:'2-digit'});
      qEl.disabled = false;
      scanBtn.disabled = false;
      footEl.textContent = DATA.meta.bauteile + ' Bauteile · ' + DATA.meta.schablonen
        + ' Schablonen · ' + DATA.meta.paare + ' Zuordnungen · gelesen aus ' + dateiName;

      dropzone('Die Datei konnte nicht ausgewertet werden: ' + (err && err.message ? err.message : err));
    }
  };
  fr.readAsArrayBuffer(file);
}

/* Dateizugriff für das nächste Öffnen merken (nur Chrome/Edge) */
function db(){
  return new Promise((res, rej) => {
    const r = indexedDB.open('schablonen-auskunft', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('handles');
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
async function merkeHandle(h){
  try{
    const d = await db();
    await new Promise((res, rej) => {
      const tx = d.transaction('handles','readwrite');
      tx.objectStore('handles').put(h, 'excel');
      tx.oncomplete = res; tx.onerror = () => rej(tx.error);
    });
  }catch(e){ /* nicht schlimm */ }
}
async function holeHandle(){
  try{
    const d = await db();
    return await new Promise((res, rej) => {
      const tx = d.transaction('handles','readonly');
      const rq = tx.objectStore('handles').get('excel');
      rq.onsuccess = () => res(rq.result || null);
      rq.onerror = () => rej(rq.error);
    });
  }catch(e){ return null; }
}

  try{
    scanStream = await mitZeitlimit(
      navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}, width:{ideal:1280}, height:{ideal:720}}}),
      8000, timeoutFehler
    );
  }catch(err){
    if(err === timeoutFehler){
      scanState.textContent = 'Kamera reagiert nicht';
      scanFoot.innerHTML = '<div class="err">Die Kamera meldet sich nicht zurück. Das passiert auf dem iPhone häufig, '
        + 'wenn die Datei nicht als richtige Webseite geöffnet wurde (z. B. Vorschau in der Dateien-App statt echter '
        + 'Safari-Tab), oder wenn Safari kein Kamerarecht besitzt.<br><br>'
        + 'Prüfen: <b>Einstellungen &rarr; Datenschutz &amp; Sicherheit &rarr; Kamera &rarr; Safari</b> muss aktiviert sein. '
        + 'Am zuverlässigsten läuft der Scanner, wenn die Datei über eine echte Adresse mit https:// aufgerufen wird, '
        + 'z. B. von GitHub Pages &mdash; das geht auch direkt aus Safari am iPhone, ganz ohne Laptop.</div>';
    } else {
      let msg = 'Auf die Kamera konnte nicht zugegriffen werden.';
      let titel = 'Kamera nicht verfügbar';
      if(err && err.name === 'NotAllowedError'){
        titel = 'Zugriff verweigert';
        msg = 'Der Kamerazugriff wurde verweigert. Auf dem iPhone passiert das bei lokal geöffneten Dateien '
          + 'grundsätzlich &mdash; iOS kann einer Datei ohne echte Webadresse keine dauerhafte Erlaubnis geben, '
          + 'da hilft auch kein Umschalten in den Einstellungen. Zuverlässig funktioniert der Scanner erst, '
          + 'wenn die Seite über <b>https://</b> aufgerufen wird, z. B. von GitHub Pages.';
      }
      else if(err && err.name === 'NotFoundError'){ titel = 'Keine Kamera gefunden'; msg = 'Es wurde keine Kamera gefunden.'; }
      else if(err && err.message) msg = err.message;
      scanState.textContent = titel;
      scanFoot.innerHTML = '<div class="err">' + msg + '</div>';
    }
    return;
  }

  scanState.textContent = 'Sucht Barcode …';

  try{
    scanVideo.srcObject = scanStream;
    try{ await mitZeitlimit(scanVideo.play(), 4000, timeoutFehler); }
    catch(e){ /* Wiedergabe kann auch ohne await-Bestätigung starten, weiterlaufen lassen */ }
    if('BarcodeDetector' in window){
      await scanMitBarcodeDetector();
    } else {
      await scanMitZXing();
    }
  }catch(err){
    scanState.textContent = 'Fehler';
    scanFoot.innerHTML = '<div class="err">' + (err && err.message ? err.message : 'Der Scanner konnte nicht gestartet werden.') + '</div>';
  }
}

async function scanMitBarcodeDetector(){
  const formate = ['code_128','code_39','code_93','ean_13','ean_8','upc_a','upc_e','itf','data_matrix','qr_code'];
  let detector;
  try{ detector = new BarcodeDetector({formats: formate}); }
  catch(e){ detector = new BarcodeDetector(); }

  const schleife = async () => {
    if(!scanAktiv) return;
    try{
      const treffer = await detector.detect(scanVideo);
      if(treffer && treffer.length){ scanTreffer(treffer[0].rawValue); return; }
    }catch(e){ /* einzelnen Frame ignorieren, weiterscannen */ }
    scanRAF = requestAnimationFrame(schleife);
  };
  scanRAF = requestAnimationFrame(schleife);
}

async function scanMitZXing(){
  const hints = new Map();
  hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, [
    ZXing.BarcodeFormat.CODE_128, ZXing.BarcodeFormat.CODE_39, ZXing.BarcodeFormat.CODE_93,
    ZXing.BarcodeFormat.EAN_13, ZXing.BarcodeFormat.EAN_8, ZXing.BarcodeFormat.UPC_A,
    ZXing.BarcodeFormat.UPC_E, ZXing.BarcodeFormat.ITF, ZXing.BarcodeFormat.DATA_MATRIX,
    ZXing.BarcodeFormat.QR_CODE
  ]);
  zxingReader = new ZXing.BrowserMultiFormatReader(hints);

  // Eigene Schleife statt ZXings decodeContinuously(): dessen eingebaute
  // Weiterversuchen-Logik bricht bei einem unerwarteten Fehlertyp (z.B. auf iOS Safari
  // beim allerersten Frame, wenn das Video technisch noch nicht ganz bereit ist) lautlos
  // ab, ohne dass danach je wieder ein Frame geprüft wird - die Kamera bleibt sichtbar an,
  // erkennt aber nichts mehr. Mit requestAnimationFrame + decode() läuft es, wie beim
  // nativen BarcodeDetector-Pfad oben, unabhängig vom Fehlertyp garantiert weiter.
  const schleife = () => {
    if(!scanAktiv) return;
    try{
      const treffer = zxingReader.decode(scanVideo);
      if(treffer){ scanTreffer(treffer.getText()); return; }
    }catch(e){ /* kein Barcode in diesem Frame - weiterscannen, unabhängig vom Fehlertyp */ }
    scanRAF = requestAnimationFrame(schleife);
  };
  scanRAF = requestAnimationFrame(schleife);
}

scanBtn.addEventListener('click', scanStarten);
document.getElementById('scanclose').addEventListener('click', scanSchliessen);
overlay.addEventListener('click', e => { if(e.target === overlay) scanSchliessen(); });
window.addEventListener('keydown', e => { if(e.key === 'Escape' && !overlay.hidden) scanSchliessen(); });

(async function start(){
  const h = await holeHandle();
  if(h){
    dateiHandle = h;
    try{
      const p = await h.queryPermission({mode:'read'});
      if(p === 'granted'){ leseDatei(await h.getFile()); return; }
      dropzone('Zuletzt verwendet: <b>' + h.name + '</b>. Der Browser fragt aus Sicherheitsgründen '
        + 'bei jedem Start einmal nach Erlaubnis &mdash; ein Klick genügt.');
      const dz = document.getElementById('dz');
      const b = document.getElementById('pick');
      b.textContent = 'Zugriff erlauben und laden';
      b.onclick = aktualisieren;
      return;
    }catch(e){ /* weiter zur Auswahl */ }
  }
  dropzone();
})();
