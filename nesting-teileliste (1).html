<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nesting Teileliste</title>
<style>
  :root {
    --wood: #3c2c27;
    --gold: #cbb38a;
    --bg: #1c1614;
    --panel: #2a201c;
    --text: #eee5db;
    --muted: #9c8a7d;
    --line: #4a3a32;
    --ok: #7fae7f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 24px;
    max-width: 760px;
    margin: 0 auto;
  }
  h1 {
    font-size: 20px;
    color: var(--gold);
    margin-bottom: 4px;
  }
  p.sub {
    color: var(--muted);
    margin-top: 0;
    font-size: 14px;
  }
  .drop {
    border: 2px dashed var(--line);
    border-radius: 10px;
    padding: 32px;
    text-align: center;
    cursor: pointer;
    background: var(--panel);
    transition: border-color .15s;
  }
  .drop:hover, .drop.drag {
    border-color: var(--gold);
  }
  .drop input { display: none; }
  .filename {
    font-size: 13px;
    color: var(--muted);
    margin-top: 8px;
  }
  .results {
    display: none;
    margin-top: 24px;
  }
  .stats {
    display: flex;
    gap: 12px;
    margin-bottom: 20px;
  }
  .stat {
    flex: 1;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 14px;
    text-align: center;
  }
  .stat .n {
    font-size: 26px;
    font-weight: 600;
    color: var(--gold);
  }
  .stat .l {
    font-size: 12px;
    color: var(--muted);
    margin-top: 2px;
  }
  .actions {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
  }
  button {
    flex: 1;
    background: var(--wood);
    color: var(--text);
    border: 1px solid var(--gold);
    border-radius: 8px;
    padding: 12px;
    font-size: 14px;
    cursor: pointer;
  }
  button:hover { background: #4a3730; }
  button:disabled { opacity: .4; cursor: default; }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
    background: var(--panel);
    border-radius: 8px;
    overflow: hidden;
  }
  th, td {
    text-align: left;
    padding: 8px 10px;
    border-bottom: 1px solid var(--line);
  }
  th {
    color: var(--gold);
    font-weight: 600;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: .03em;
  }
  td.count {
    color: var(--muted);
    text-align: right;
  }
  .tabs {
    display: flex;
    gap: 4px;
    margin-bottom: 10px;
  }
  .tab {
    padding: 8px 14px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 6px 6px 0 0;
    cursor: pointer;
    font-size: 13px;
    color: var(--muted);
  }
  .tab.active {
    color: var(--gold);
    border-bottom-color: var(--panel);
    background: var(--panel);
    font-weight: 600;
  }
  .listbox { max-height: 340px; overflow-y: auto; }
  .empty {
    color: var(--muted);
    font-size: 13px;
    text-align: center;
    padding: 20px;
  }
  .err {
    color: #e08a7a;
    font-size: 13px;
    margin-top: 10px;
  }
</style>
</head>
<body>

<h1>Nesting Teileliste</h1>
<p class="sub">CSV importieren &rarr; HLT-STD-Teile und proalpha-Nummern getrennt, sortiert, zählbar exportieren.</p>

<label class="drop" id="drop">
  <input type="file" id="file" accept=".csv">
  <div>CSV hier reinziehen oder klicken zum Auswählen</div>
  <div class="filename" id="filename"></div>
</label>
<div class="err" id="err"></div>

<div class="results" id="results">
  <div class="stats">
    <div class="stat"><div class="n" id="statRows">0</div><div class="l">Zeilen gesamt</div></div>
    <div class="stat"><div class="n" id="statHlt">0</div><div class="l">HLT-STD Zeilen</div></div>
    <div class="stat"><div class="n" id="statPro">0</div><div class="l">proalpha Zeilen</div></div>
  </div>

  <div class="actions">
    <button id="dlHlt">HLT-STD CSV runterladen</button>
    <button id="dlPro">proalpha CSV runterladen</button>
  </div>

  <div class="tabs">
    <div class="tab active" data-tab="hlt">HLT-STD Teile</div>
    <div class="tab" data-tab="pro">proalpha Nummern</div>
  </div>
  <div class="listbox">
    <table id="table">
      <thead><tr><th id="colHead">Bauteilnummer</th><th>Rest der Zeile</th></tr></thead>
      <tbody id="tbody"></tbody>
    </table>
    <div class="empty" id="emptyMsg" style="display:none;">Keine Daten</div>
  </div>
</div>

<script>
let hltRows = [];
let proRows = [];
let currentTab = 'hlt';

const dropEl = document.getElementById('drop');
const fileEl = document.getElementById('file');
const filenameEl = document.getElementById('filename');
const errEl = document.getElementById('err');

dropEl.addEventListener('dragover', e => { e.preventDefault(); dropEl.classList.add('drag'); });
dropEl.addEventListener('dragleave', () => dropEl.classList.remove('drag'));
dropEl.addEventListener('drop', e => {
  e.preventDefault();
  dropEl.classList.remove('drag');
  if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
});
fileEl.addEventListener('change', () => {
  if (fileEl.files.length) handleFile(fileEl.files[0]);
});

function handleFile(file) {
  errEl.textContent = '';
  filenameEl.textContent = file.name;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      // Nesting-CSVs sind ISO-8859-1 codiert
      const decoder = new TextDecoder('iso-8859-1');
      const text = decoder.decode(reader.result);
      parseCSV(text);
    } catch (e) {
      errEl.textContent = 'Fehler beim Einlesen: ' + e.message;
    }
  };
  reader.readAsArrayBuffer(file);
}

function parseCSV(text) {
  const lines = text.split(/\r\n|\n|\r/).filter(l => l.trim().length > 0);
  const hlt = [];
  const pro = [];

  for (const line of lines) {
    const cols = line.split(';');
    const colG = (cols[6] || '').trim();
    if (!colG) continue; // Spalte G leer -> Zeile ignorieren
    if (colG === 'HLT-STD') {
      hlt.push(line);
    } else {
      pro.push(line);
    }
  }

  // Reihenfolge der Original-CSV wird beibehalten, nicht sortiert
  hltRows = hlt;
  proRows = pro;

  const totalRows = hlt.length + pro.length;
  document.getElementById('statRows').textContent = totalRows;
  document.getElementById('statHlt').textContent = hltRows.length;
  document.getElementById('statPro').textContent = proRows.length;
  document.getElementById('results').style.display = 'block';

  if (totalRows === 0) {
    errEl.textContent = 'Keine Zeilen mit Inhalt in Spalte G gefunden. Ist das die richtige Datei / Trennzeichen ";"?';
  }

  renderTable();
}

function renderTable() {
  const tbody = document.getElementById('tbody');
  const colHead = document.getElementById('colHead');
  const emptyMsg = document.getElementById('emptyMsg');
  const list = currentTab === 'hlt' ? hltRows : proRows;
  colHead.textContent = currentTab === 'hlt' ? 'Bauteilnummer (HLT-STD)' : 'Bauteilnummer (proalpha)';

  tbody.innerHTML = '';
  if (list.length === 0) {
    emptyMsg.style.display = 'block';
    return;
  }
  emptyMsg.style.display = 'none';
  for (const line of list) {
    const cols = line.split(';');
    const colA = cols[0] || '';
    const rest = cols.slice(1).join(' | ');
    const tr = document.createElement('tr');
    tr.innerHTML = `<td>${escapeHtml(colA)}</td><td class="count">${escapeHtml(rest)}</td>`;
    tbody.appendChild(tr);
  }
}

document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    currentTab = tab.dataset.tab;
    renderTable();
  });
});

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}

function downloadCSV(rows, filename) {
  const csv = rows.join('\r\n') + '\r\n';
  const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  a.click();
  URL.revokeObjectURL(url);
}

document.getElementById('dlHlt').addEventListener('click', () => {
  if (hltRows.length === 0) return;
  downloadCSV(hltRows, 'HLT Teile.csv');
});
document.getElementById('dlPro').addEventListener('click', () => {
  if (proRows.length === 0) return;
  downloadCSV(proRows, 'Nestteile.csv');
});
</script>
</body>
</html>
